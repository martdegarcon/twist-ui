<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combobox — Twist UI</title>
<meta name="description" content="Комбобокс, в котором набранные буквы тяжелеют внутри каждого варианта, а варианты плавно пересортировываются.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/combobox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Combobox</b></a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Куда едем?</h1>
    <p class="sub">Буквы тяжелеют в каждом совпадении</p>
  </div>
  <div class="combo" id="combo">
    <label class="field">
      <span class="lbl">Город</span>
      <input id="q" autocomplete="off" spellcheck="false" placeholder="Начните вводить" role="combobox" aria-expanded="true" aria-controls="list">
    </label>
    <ul class="list" id="list" role="listbox"></ul>
  </div>
</main>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
