<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menubar — Twist UI</title>
<meta name="description" content="Меню, которое реагирует на клавиши-модификаторы: зажмите ⌘ — и подсвечены останутся только сочетания с ⌘.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/menubar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Menubar</b></a>

<main class="card wide">
  <div class="title-wrap">
    <h1 class="title">Меню</h1>
    <p class="sub">Откройте меню и зажмите ⌘, ⇧ или ⌥ — оно отфильтруется само</p>
  </div>
  <div class="app">
    <nav class="mb" id="mb" role="menubar"></nav>
    <div class="dd" id="dd" role="menu"><div class="dd-in" id="ddIn"></div></div>
  </div>
  <div class="mods" id="mods" aria-label="Клавиши-модификаторы (на сенсорных экранах — нажатием)">
    <button data-m="cmd">⌘</button><button data-m="shift">⇧</button><button data-m="alt">⌥</button><button data-m="ctrl">⌃</button>
  </div>
</main>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
