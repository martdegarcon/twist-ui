<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch — Twist UI</title>
<meta name="description" content="Переключатель, в котором слово состояния перетекает, а подпись набирает вес.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/switch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Switch</b></a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Разрешения</h1>
    <p class="sub">Ручка тянется на ходу, слово меняется следом</p>
  </div>
  <div class="list">
    <label class="row" data-i="0">
      <span class="txt"><span class="name">Уведомления</span>
        <span class="state"><span class="w off on">Выкл</span><span class="w on-w">Вкл</span></span></span>
      <span class="sw"><span class="knob"></span></span>
      <input type="checkbox" switch class="native" aria-label="Уведомления">
    </label>
    <label class="row" data-i="1">
      <span class="txt"><span class="name">Звуки</span>
        <span class="state"><span class="w off on">Выкл</span><span class="w on-w">Вкл</span></span></span>
      <span class="sw"><span class="knob"></span></span>
      <input type="checkbox" switch class="native" aria-label="Звуки">
    </label>
    <label class="row" data-i="2">
      <span class="txt"><span class="name">Геолокация</span>
        <span class="state"><span class="w off on">Выкл</span><span class="w on-w">Вкл</span></span></span>
      <span class="sw"><span class="knob"></span></span>
      <input type="checkbox" switch class="native" aria-label="Геолокация">
    </label>
  </div>
</main>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
