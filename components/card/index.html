<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="description" content="Двухслойная карточка: верхний слой приподнимается и открывает детали под ним.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
<a class="pack-nav" href="../../#/components/card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Card</b></a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Билет</h1>
    <p class="sub">Наведите или коснитесь — под верхним слоем детали</p>
  </div>
  <div class="tk" id="tk" tabindex="0">
    <div class="under">
      <div class="r"><span>Дата</span><b>Пт, 24 окт</b></div>
      <div class="r"><span>Вход</span><b>19:00</b></div>
      <div class="r"><span>Место</span><b>Ряд 6 · 14</b></div>
      <div class="r big"><span>Итого</span><b>4 800 ₽</b></div>
    </div>
    <div class="top">
      <span class="k">Концерт</span>
      <h2>Тихие интерфейсы</h2>
      <p>Москва · Большой зал</p>
      <span class="hint">Приподнимите ↑</span>
    </div>
  </div>
</main>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
