<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider — Twist UI</title>
<meta name="description" content="Слайдер, значение которого — насыщенность его собственной цифры.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/slider"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Slider</b></a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Начертание</h1>
    <p class="sub">Тяните — число тяжелеет вместе со значением</p>
  </div>

  <div class="readout">
    <span class="num" id="num">400</span>
    <div class="swap-stack wname" id="wname">
      <span data-k="Thin">Тонкое</span><span data-k="ExtraLight">Сверхсветлое</span><span data-k="Light">Светлое</span>
      <span data-k="Regular" class="on">Обычное</span><span data-k="Medium">Среднее</span><span data-k="SemiBold">Полужирное</span>
      <span data-k="Bold">Жирное</span><span data-k="ExtraBold">Сверхжирное</span><span data-k="Black">Чёрное</span>
    </div>
  </div>

  <div class="slider" id="slider">
    <div class="fill" id="fill"></div>
    <div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="thumb" id="thumb"></div>
    <input type="range" id="range" min="100" max="900" step="1" value="400" aria-label="Насыщенность шрифта">
  </div>
</main>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
