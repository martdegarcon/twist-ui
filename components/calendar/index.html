<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar — Twist UI</title>
<meta name="description" content="Календарь, в котором дни накатывают по диагонали при смене месяца, а выбранный диапазон набирает вес.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Calendar</b></a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Даты поездки</h1>
    <p class="sub">Листайте месяцы, отметьте две даты</p>
  </div>
  <div class="cal">
    <div class="top">
      <button class="nav" id="prev" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="month" id="month"></div>
      <button class="nav" id="next" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="dow"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <p class="range" id="range">Выберите дату заезда</p>
</main>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
