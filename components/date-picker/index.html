<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date Picker — Twist UI</title>
<meta name="description" content="Поле даты, где день, месяц и год — отдельные барабаны, которые крутятся независимо.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/date-picker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Date Picker</b></a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Дата рождения</h1>
    <p class="sub">Каждая часть — барабан: крутите или ↑&nbsp;↓</p>
  </div>
  <div class="dp" id="dp">
    <div class="seg" data-k="d" tabindex="0" aria-label="День"><div class="win"></div></div>
    <div class="seg wide" data-k="m" tabindex="0" aria-label="Месяц"><div class="win"></div></div>
    <div class="seg" data-k="y" tabindex="0" aria-label="Год"><div class="win"></div></div>
  </div>
  <p class="out" id="out"></p>
  <button class="btn" id="today" type="button">Сегодня</button>
</main>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
