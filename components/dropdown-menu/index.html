<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown Menu — Twist UI</title>
<meta name="description" content="Выпадающее меню: подсветка скользит за курсором и придаёт вес пункту под ним.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/dropdown-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Dropdown Menu</b></a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Меню</h1>
    <p class="sub">Подсветка следует за курсором и придаёт вес</p>
  </div>
  <div class="wrap">
    <button class="btn" id="trig" type="button" aria-haspopup="menu" aria-expanded="false">Действия <i class="chev"></i></button>
    <div class="menu" id="menu" role="menu">
      <span class="hl" id="hl"></span>
      <div class="mi" role="menuitem">Переименовать<kbd>F2</kbd></div>
      <div class="mi" role="menuitem">Дублировать<kbd>⌘D</kbd></div>
      <div class="mi" role="menuitem">Переместить…</div>
      <div class="sep"></div>
      <div class="mi" role="menuitem">Поделиться<kbd>⇧⌘S</kbd></div>
      <div class="mi" role="menuitem">В архив</div>
      <div class="sep"></div>
      <div class="mi danger" role="menuitem">Удалить<kbd>⌫</kbd></div>
    </div>
  </div>
  <p class="picked" id="picked"></p>
</main>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
