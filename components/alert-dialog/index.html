<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert Dialog — Twist UI</title>
<meta name="description" content="Опасное действие подтверждается удержанием, а не вторым кликом. Кнопка называет, что именно удаляет.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/alert-dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Alert Dialog</b></a>

<main class="card">
  <div class="title-wrap">
    <h1 class="title">Проекты</h1>
    <p class="sub">Для удаления — удержание, а не второй клик</p>
  </div>
  <div class="proj" id="proj">
    <span class="pt"><b>Atlas</b><span>24 файла · изменён сегодня</span></span>
    <button class="del" id="del" type="button">Удалить</button>
  </div>
  <div class="links"><a id="restore">Восстановить проект</a></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="alert" id="alert" role="alertdialog" aria-modal="true" aria-labelledby="aTitle" aria-describedby="aDesc">
  <h2 id="aTitle">Удалить «Atlas»?</h2>
  <p id="aDesc">Все 24 файла удалятся вместе с ним. Это нельзя отменить.</p>
  <div class="hold-wrap" id="holdWrap">
    <button class="hold" id="hold" type="button">
      <span class="bar" id="bar"></span>
      <span class="hl h1">Зажмите, чтобы удалить Atlas</span>
      <span class="hl h2">Не отпускайте…</span>
      <span class="hl h3">Удалено</span>
    </button>
  </div>
  <button class="btn ghost" id="cancel" type="button">Отмена</button>
</div>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>
</body>
</html>
