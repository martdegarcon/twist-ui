<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawer — Twist UI</title>
<meta name="description" content="Нижняя шторка, которая отодвигает страницу назад: страница уменьшается и темнеет ровно настолько, насколько вы тянете.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pack-nav" href="../../#/components/drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Twist UI · <b>Drawer</b></a>

<div class="page" id="page">
<main class="card">
  <div class="title-wrap">
    <h1 class="title">Atlas</h1>
    <p class="sub">Потяните шторку — страница идёт за пальцем</p>
  </div>
  <div class="hero"></div>
  <button class="btn" id="open" type="button">Поделиться</button>
</main>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Поделиться">
  <div class="grab" id="grab"><i></i></div>
  <h2>Поделиться «Atlas»</h2>
  <div class="opts">
    <button><span class="ic">⧉</span>Ссылка</button><button><span class="ic">✉</span>Почта</button>
    <button><span class="ic">◎</span>Пригласить</button><button><span class="ic">⇩</span>Экспорт</button>
  </div>
  <button class="btn light" id="done" type="button">Готово</button>
</section>

<script src="../../shared/haptics.js"></script>
<script src="script.js"></script>

</html>
